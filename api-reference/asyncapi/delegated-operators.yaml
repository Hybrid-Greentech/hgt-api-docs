asyncapi: 3.0.0
info:
  title: Delegated Operator - Management and Monitoring API
  version: v3.2.0
  description: >
    Real-time API for managing and monitoring distributed energy resources
    (DERs) including batteries, solar installations, and other grid-connected
    assets. 

    This API enables:
    - Dispatch of flexibility services and grid balancing tasks
    - Real-time telemetry collection from assets

    The API follows a pub/sub pattern using MQTT for reliable, real-time
    communication between the central system and edge devices.
defaultContentType: application/json
servers:
  sandbox:
    host: aggregator.gridhub.dev:8883
    protocol: mqtts
    description: |
      Sandbox environment for testing and integration. Carries MQTT over TLS on TCP.
      Simulated assets only, with no real grid interactions. Secure WebSockets are not
      available in sandbox. Use TLS 1.2 or later.
    security:
      - $ref: '#/components/securitySchemes/user-password'
  production:
    host: n1.link.gridhub.ai:8883
    protocol: mqtts
    description: |
      Production environment, carrying MQTT over TLS on TCP. Real-time grid
      interactions, strict security enforcement, and production SLA guarantees. Use
      TLS 1.2 or later.
    security:
      - $ref: '#/components/securitySchemes/user-password'
  production-websockets:
    host: n1.link.gridhub.ai:8084
    pathname: /mqtt
    protocol: wss
    description: |
      Production environment, carrying MQTT over secure WebSockets. Request the `mqtt`
      WebSocket subprotocol during the upgrade handshake. The path is required.
      Available in production only.
    security:
      - $ref: '#/components/securitySchemes/user-password'
channels:
  Activations:
    address: '{priceZone}/{customerName}/activation/{assetId}'
    messages:
      onActivation.message:
        $ref: '#/components/messages/activationMessage'
  Heartbeat:
    address: '{priceZone}/{customerName}/heartbeat/{assetId}'
    messages:
      onHeartbeat.message:
        $ref: '#/components/messages/heartbeatMessage'
  Events:
    address: '{priceZone}/{customerName}/events/{assetId}'
    messages:
      onEvent.message:
        $ref: '#/components/messages/eventMessage'
  AssetMeasurements:
    address: '{priceZone}/{customerName}/measurements/{assetId}'
    messages:
      onMeasurement.message:
        $ref: '#/components/messages/measurementMessage'
  TaskEvents:
    address: '{priceZone}/{customerName}/tasks/events/{assetId}'
    messages:
      onTaskEvent.message:
        $ref: '#/components/messages/onTaskEventMessage'
  Tasks:
    address: '{priceZone}/{customerName}/tasks/{assetId}'
    messages:
      onDispatch.message:
        $ref: '#/components/messages/taskMessage'
    description: |
      Channel for dispatching control signals and tasks to assets.
      The hierarchical structure allows for:
      - Geographic grouping via priceZone
      - Multi-tenancy via customerName
      - Individual asset targeting via assetId
    parameters:
      priceZone:
        $ref: '#/components/parameters/priceZone'
      customerName:
        $ref: '#/components/parameters/customerName'
      assetId:
        $ref: '#/components/parameters/assetId'
operations:
  onActivation:
    action: receive
    channel:
      $ref: '#/channels/Activations'
    messages:
      - $ref: '#/channels/Activations/messages/onActivation.message'
    summary: Activation Message
    description: |
      Activation messages sent with a power value that indicates a power activation that needs to take place for a specific market
  onHeartbeat:
    action: receive
    channel:
      $ref: '#/channels/Heartbeat'
    messages:
      - $ref: '#/channels/Heartbeat/messages/onHeartbeat.message'
    summary: Heartbeat Message
    description: |
      Liveness signal published once per second for every asset. Confirms that the
      platform's link to the asset is live between activations.
  onEvent:
    action: send
    channel:
      $ref: '#/channels/Events'
    messages:
      - $ref: '#/channels/Events/messages/onEvent.message'
    summary: Measurement Message
    description: |
      Send measurement messages from measurement-devices, tools and other
      devices on location
  onMeasurement:
    action: send
    channel:
      $ref: '#/channels/AssetMeasurements'
    messages:
      - $ref: '#/channels/AssetMeasurements/messages/onMeasurement.message'
    summary: Measurement Message
    description: |
      Send measurement messages from measurement-devices, tools and other
      devices on location
  onTaskEvent:
    action: send
    channel:
      $ref: '#/channels/TaskEvents'
    messages:
      - $ref: '#/channels/TaskEvents/messages/onTaskEvent.message'
  onDispatch:
    action: receive
    channel:
      $ref: '#/channels/Tasks'
    messages:
      - $ref: '#/channels/Tasks/messages/onDispatch.message'
    summary: Task Dispatch
    description: |
      Receive and process incoming control tasks and setpoints.
      Implementation must:
      - Validate task parameters
      - Check asset availability
      - Respect asset constraints
      - Acknowledge receipt within 30 seconds
components:
  schemas:
    taskStatus:
      type: string
      enum:
        - STARTED
        - FAILED
        - INVALID
        - UNAUTHORISED
        - COMPLETED
    eventDomain:
      type: string
      enum:
        - NETWORKING
        - ASSET
        - NOTAVAILABLE
      default: NOTAVAILABLE
    severity:
      type: string
      enum:
        - INFO
        - LOW
        - HIGH
        - CRITICAL
    measurementType:
      type: string
      description: |
        Describes the measurement types that are allowed when sending the data. Most of them are straightforward
        - `afrrBaseline` is the sum of all setpoints except the aFRR setpoint. This is all the actions the battery is doing except aFRR. This can be in either direction. This will be used to compute the delivered aFRR energy using the aFRR Baseline.
        - `mfrrBaseline` is the same quantity for mFRR: the sum of all setpoints except the mFRR setpoint. Publish both baselines when the asset is enrolled in both markets.
        - `availablePowerUp` and `availablePowerDown` are the power the asset can still deliver in each regulation direction. The platform dispatches against the last published value.
        - `availableEnergyUp` and `availableEnergyDown` are the energy still available in each direction.
        - `powerDc` is deprecated. It is diagnostic only and no longer part of the data requirements. The enum value remains so that existing publishers do not fail validation. Do not implement it in new integrations.
        - `powerSocManagement` is deprecated. The platform ignores the value. The enum value remains so that existing publishers do not fail validation. Do not implement it in new integrations.

        Required data frequencies depend on the market the asset is prequalified for, and on the device type. See the Data Standards documentation.

      enum:
        - frequency
        - powerAc
        - powerDc
        - afrrBaseline
        - mfrrBaseline
        - availablePowerUp
        - availablePowerDown
        - availableEnergyUp
        - availableEnergyDown
        - powerSocManagement
        - stateOfCharge
    taskType:
      type: string
      description: |
        The market an asset is delivering. `dayahead` is deprecated in favour of `wholesale`, which
        also covers intraday continuous and intentional imbalance. The platform maps `dayahead` to
        `wholesale`; the enum value remains so that existing publishers do not fail validation.
      enum:
        - ffr
        - fcr
        - fcrd
        - fcrn
        - afrr
        - mfrr
        - wholesale
        - dayahead
    units:
      type: string
      enum:
        - kW
        - kWh
        - Hz
        - '%'
        - W
    servicePayload:
      type: object
      properties:
        priceZone:
          type: string
        serviceType:
          type: string
        serviceEnvironment:
          type: string
      required:
        - priceZone
        - serviceType
        - serviceEnvironment
    quantityPayload:
      type: object
      properties:
        chargePower:
          type: integer
        dischargePower:
          type: integer
        unit:
          $ref: '#/components/schemas/units'
      required:
        - chargePower
        - dischargePower
        - unit
    taskStatusPayload:
      type: object
      properties:
        assetTimestamp:
          anyOf:
            - type: integer
            - type: 'null'
        serverTimestamp:
          type: integer
        taskId:
          type: string
          format: uuid
        taskStatus:
          $ref: '#/components/schemas/taskStatus'
    taskEventPayload:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        eventId:
          type: string
          format: ulid
          description: |
            ULID formatted string
        payload:
          $ref: '#/components/schemas/taskStatusPayload'
    eventContextObject:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
    eventPayload:
      type: object
      properties:
        assetTimestamp:
          anyOf:
            - type: integer
            - type: 'null'
        serverTimestamp:
          type: integer
        severity:
          $ref: '#/components/schemas/severity'
        domain:
          $ref: '#/components/schemas/eventDomain'
        eventContext:
          $ref: '#/components/schemas/eventContextObject'
    eventMessagePayload:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        eventId:
          type: string
          format: ulid
          description: |
            ULID formatted string
        payload:
          $ref: '#/components/schemas/eventPayload'
    activationSetpoint:
      type: object
      properties:
        value:
          type: number
          format: float
          description: |
            Power setpoint the asset must move to. Follows the generator sign
            convention, where export is positive and import is negative. A value of
            `0` deactivates the asset. Serialised from a 32-bit float, so about seven
            significant digits are meaningful.
        unit:
          type: string
          description: |
            Unit of `value`. Always `kW`.
      required:
        - value
        - unit
    activationPayload:
      type: object
      properties:
        messageId:
          type: string
          description: |
            Unique identifier for the activation message. Generated per message as a
            ULID. Use it to discard redeliveries.
        status:
          type: string
          description: |
            Always `ACTIVE`. Retained for backward compatibility and never varies.
            Deactivation is expressed as a `setpoint.value` of `0`, not as a change of
            status. Don't branch on this value.
        timestamp:
          type: string
          format: date-time
          description: |
            Time at which the activation was generated. Formatted as an RFC 3339
            timestamp in UTC. The number of fractional-second digits is not fixed.
        task:
          type: string
          description: |
            Identifier of the task this activation delivers. Matches the `taskId` of a
            task previously dispatched on the tasks channel.
        setpoint:
          $ref: '#/components/schemas/activationSetpoint'
      required:
        - messageId
        - status
        - timestamp
        - task
        - setpoint
    heartbeatPayload:
      type: object
      properties:
        eventId:
          type: string
          description: |
            Unique identifier for the heartbeat message. Generated per message as a
            ULID.
        value:
          type: number
          format: float
          description: |
            Alternates between `0` and `1` on consecutive heartbeats, starting at `0`.
            The value carries no information beyond separating a fresh heartbeat from a
            repeated payload.
      required:
        - eventId
        - value
    measurementPayload:
      type: object
      properties:
        assetTimestamp:
          anyOf:
            - type: integer
            - type: 'null'
        serverTimestamp:
          type: integer
        value:
          type:
            - number
            - string
            - boolean
          description: |
            Actual Measurement Value depends on measurement type:
              - number for power & frequency
              - string for state indicators
              - boolean for binary states
        unit:
          $ref: '#/components/schemas/units'
      required:
        - serverTimestamp
        - value
        - unit
    measurementMessagePayload:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        eventId:
          type: string
          format: ulid
          description: |
            ULID formatted string
        measurementType:
          $ref: '#/components/schemas/measurementType'
        payload:
          $ref: '#/components/schemas/measurementPayload'
      required:
        - assetId
        - eventId
        - measurementType
    taskMessagePayload:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        startTime:
          type: integer
          description: |
            Unix timestamp in [ms] since epoch and must be 
            synchronised with a reliable time source.
            Example: 1698422400000 (represents 2023-10-27T12:00:00Z)
        endTime:
          type: integer
          description: |
            Unix timestamp in [ms] since epoch and must be 
            synchronised with a reliable time source.
            Example: 1698422400000 (represents 2023-10-27T12:00:00Z)
        service:
          $ref: '#/components/schemas/servicePayload'
        quantity:
          $ref: '#/components/schemas/quantityPayload'
  messages:
    activationMessage:
      name: Activation Message
      title: Activation Message
      description: Message containing data to activate the asset in a particular market
      contentType: application/json
      payload:
        $ref: '#/components/schemas/activationPayload'
      examples:
        - name: exportActivation
          summary: Export setpoint during an active task
          payload:
            messageId: 01M1GST35A5N67FK9NNRF1JRJZ
            status: ACTIVE
            timestamp: '2026-09-02T10:14:37.482913551Z'
            task: a0766747-39b5-4258-9408-fcaef40690a1
            setpoint:
              value: 184.26373
              unit: kW
        - name: importActivation
          summary: Import setpoint on the same task
          payload:
            messageId: 01M1GST35A3BWM0NNWAHTP34QP
            status: ACTIVE
            timestamp: '2026-09-02T10:14:41.907442183Z'
            task: a0766747-39b5-4258-9408-fcaef40690a1
            setpoint:
              value: -96.4812
              unit: kW
        - name: deactivation
          summary: Zero setpoint releasing the asset
          payload:
            messageId: 01M1GST35A7D7YSZPJ8W16015M
            status: ACTIVE
            timestamp: '2026-09-02T10:15:02.118764025Z'
            task: a0766747-39b5-4258-9408-fcaef40690a1
            setpoint:
              value: 0
              unit: kW
    heartbeatMessage:
      name: Heartbeat Message
      title: Heartbeat Message
      description: Liveness signal published once per second for every asset
      contentType: application/json
      payload:
        $ref: '#/components/schemas/heartbeatPayload'
      examples:
        - name: heartbeat
          summary: A single heartbeat
          payload:
            eventId: 01M1GST35ATGXHDA0GTTASWP5B
            value: 0
        - name: nextHeartbeat
          summary: The following heartbeat, one second later
          payload:
            eventId: 01M1GST35ATP0A4SXDJ91M6EXD
            value: 1
    onTaskEventMessage:
      name: On Task Event Message
      title: Task Event Message
      description: Messages in response to a task event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/taskEventPayload'
    eventMessage:
      name: Event Message
      title: Event Messages
      description: Messages containing events on site
      contentType: application/json
      payload:
        $ref: '#/components/schemas/eventMessagePayload'
    measurementMessage:
      name: Measurement Message
      title: On site measurement message
      description: Message containing measurements made on site
      contentType: application/json
      payload:
        $ref: '#/components/schemas/measurementMessagePayload'
      examples:
        - name: powerAc
          summary: AC power measurement from the site meter
          payload:
            assetId: ddd80e3e-bb64-4130-b3cb-fef4c2d949fe
            eventId: 01M1GST35APXKNTBYRZY57BX69
            measurementType: powerAc
            payload:
              assetTimestamp: 1788344077482
              serverTimestamp: 1788344077549
              value: 183.91274
              unit: kW
    taskMessage:
      name: taskMessage
      title: Task Assignment Message
      description: Message containing task assignments for assets
      contentType: application/json
      payload:
        $ref: '#/components/schemas/taskMessagePayload'
  parameters:
    priceZone:
      description: |
        Geographic market area identifier.
        Used for:
        - Market segregation
        - Pricing boundaries
        - Regulatory compliance
        Example: "DK1", "SE3", "NO2"
    customerName:
      description: |
        Customer namespace identifier.
        - Must be unique within price zone
        - Used for multi-tenant isolation
        - Part of access control
        Example: "customer-abc-123"
    assetId:
      description: |
        Unique asset identifier (UUID format)
        Represents:
        - Individual DER units
        - Measurement points
        - Controllable resources
        Must be registered in system before use
  securitySchemes:
    user-password:
      type: userPassword
      description: |
        Credentials are generated during asset
        registration and must be securely stored.
        Connection attempts with invalid credentials
        will be logged and may trigger alerts.
