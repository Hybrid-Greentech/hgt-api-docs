asyncapi: 3.0.0
info:
  title: Integration of EV Chargers - Using OCPP Protocol
  version: 3.0.2
  description: >
    Real-time API for managing and monitoring EV Charge Point Systems that  are
    OCPP Compatible. This connectivity enables:
      - Dispatch of flexibility and control
      - Real time telemetry collection from assets
      - Event monitoring and alarms

    This is built on MQTT for reliable, real-time communication between the
    central system and edge devices. Operations are marked with `[OPTIONAL]` in
    the case that they are not required for implementation purposes.
defaultContentType: application/json
servers:
  sandbox:
    host: aggregator.gridhub.dev:8883
    protocol: mqtts
    description: |
      Sandbox environment for testing and integration
      - Simulated assets available
      - No real grid interactions
      - Perfect for development and testing
    security:
      - $ref: '#/components/securitySchemes/user-password'
  production:
    host: n1.link.gridhub.ai:8883
    protocol: mqtts
    description: |
      Production environment for real asset operations
      - Real-time grid interactions
      - Strict security enforcement
      - Production SLA guarantees
    security:
      - $ref: '#/components/securitySchemes/user-password'
channels:
  ResourceRegistrationInBulk:
    description: >
      This is the same as registering a single resource in terms of the data but
      allows for bulk registration with an array of individual records in the
      system.
    address: '{priceZone}/{customerName}/v1/bulk/register'
    messages:
      Registration.message:
        $ref: '#/components/messages/RegisterResourceInBulkMessage'
  ResourceRegistration:
    description: >
      Used to register a resource (EVSE or EV Charger) in the system allowing it
      be controlled by the system for activating the resource in providing
      flexibility. The resource also allows self-identification necessary for
      controlling the resource correctly. This topic is used for both
      subscribing the resource from the resource layer. To `Unsubscribe` a
      resource, use the `ResourceUpdates` channel for operations. On
      `unsubscribing` a resource, the data is not deleted on the resource, it is
      marked as `unsubscribed` so that it is not picked during operations.
    address: '{priceZone}/{customerName}/v1/register'
    messages:
      Registration.message:
        $ref: '#/components/messages/RegisterResourceMessage'
  ResourceUpdates:
    description: |
      Used for partial modifications to a resource available in the system.
    address: '{priceZone}/{customerName}/v1/update/{resourceId}'
    messages:
      UpdateResource.message:
        $ref: '#/components/messages/UpdateResourceMessage'
  PowerMeasurements:
    description: >
      Topic for sending the power measurements on the resource. Each topic is
      namespaced to a specific resource (i.e., EVSE or EV Charger) with a
      message that handles the measurement in the system.
    address: '{priceZone}/{customerName}/v1/power/{resourceId}'
    messages:
      PowerMeasurement.message:
        $ref: '#/components/messages/PowerMeasurementMessage'
  StatusEvents:
    description: >
      Topic for sending status events on a single resource as namespaced.
      Messages can be dependent on the resource type and describes the
      information on the resource level for operational purposes.
    address: '{priceZone}/{customerName}/v1/status/{resourceId}'
    messages:
      Event.message:
        $ref: '#/components/messages/EventsMessage'
  Activations:
    address: '{priceZone}/{customerName}/v1/activation/{resourceId}'
    messages:
      Activation.v1.message:
        $ref: '#/components/messages/ActivationMessagev1'
      Activation.v2.message:
        $ref: '#/components/messages/ActivationMessagev2'
  BulkActivation:
    address: '{priceZone}/{customerName}/v1/bulk/activation'
    messages:
      BulkActivation.v1.message:
        $ref: '#/components/messages/BulkActivationMessagev1'
  Acknowledgement:
    address: '{priceZone}/{customerName}/v1/acknowledgement/{resourceId}'
    messages:
      Activation.message:
        $ref: '#/components/messages/AcknowledgementMessage'
  BulkAcknowledgement:
    address: '{priceZone}/{customerName}/v1/bulk/acknowledgement'
    messages:
      Activation.message:
        $ref: '#/components/messages/AcknowledgeInBulkMessage'
operations:
  AcknowledgeActivationInBulk:
    title: Acknowledge a bulk activation of resources
    action: send
    channel:
      $ref: '#/channels/BulkAcknowledgement'
    messages:
      - $ref: '#/channels/BulkAcknowledgement/messages/Activation.message'
  ActivationAcknowledgement:
    title: Acknowledgement for a resource-specific activation
    action: send
    channel:
      $ref: '#/channels/Acknowledgement'
    messages:
      - $ref: '#/channels/Acknowledgement/messages/Activation.message'
  ResourceActivationInBulk:
    title: Activation of a series of resources
    action: receive
    channel:
      $ref: '#/channels/BulkActivation'
    reply:
      channel:
        $ref: '#/channels/BulkAcknowledgement'
    messages:
      - $ref: '#/channels/BulkActivation/messages/BulkActivation.v1.message'
  ResourceActivation:
    title: Resource-specific activation in a specific market
    action: receive
    channel:
      $ref: '#/channels/Activations'
    reply:
      channel:
        $ref: '#/channels/Acknowledgement'
    messages:
      - title: Activation Message v1
        $ref: '#/channels/Activations/messages/Activation.v1.message'
      - title: Activation Message v2
        $ref: '#/channels/Activations/messages/Activation.v2.message'
  OnEvent:
    title: Status Events for a resource
    action: send
    channel:
      $ref: '#/channels/StatusEvents'
    messages:
      - $ref: '#/channels/StatusEvents/messages/Event.message'
  OnMeasurement:
    title: Power measurement events for a specific resource
    action: send
    channel:
      $ref: '#/channels/PowerMeasurements'
    messages:
      - $ref: '#/channels/PowerMeasurements/messages/PowerMeasurement.message'
  OnResourceRegistrationBulk:
    title: Bulk registration of resources
    action: send
    channel:
      $ref: '#/channels/ResourceRegistrationInBulk'
    messages:
      - $ref: '#/channels/ResourceRegistrationInBulk/messages/Registration.message'
  OnResourceRegistration:
    title: Resource registration
    action: send
    channel:
      $ref: '#/channels/ResourceRegistration'
    messages:
      - $ref: '#/channels/ResourceRegistration/messages/Registration.message'
  OnResourceUpdate:
    title: Partial Modifications to a Resource
    action: send
    channel:
      $ref: '#/channels/ResourceUpdates'
    messages:
      - $ref: '#/channels/ResourceUpdates/messages/UpdateResource.message'
components:
  schemas:
    resourceId:
      type: string
    eventId:
      anyOf:
        - type: string
          format: ulid
    nullableTimestamp:
      description: |
        Timestamp that can be nullable in the case that it is not available.
      OneOf:
        - type: integer
          description: |
            Timestamp in epoch format with units in milliseconds [ms]. 
        - type: 'null'
    timestamp:
      type: integer
      description: |
        Timestamp in epoch format with units in milliseconds [ms].
    resourceSchedule:
      title: Resource Schedule
      description: >
        Any smart-charging or optimisation based on prices or user-input can be
        updated daily using this setup. This allows Hybrid Greentech to
        understand likely timestamp when a particular resource becomes fully
        available in the system for control.
      type: object
      properties:
        starts_at:
          type: string
          format: '%H:%M'
        ends_at:
          type: string
          format: '%H:%M'
    resourceCapability:
      type: string
      description: |
        `DynamicBinning` can be specified however, it is not utilised during runtime. Therefore it is not supported.
      enum:
        - Basic
        - Standard
        - Enhanced
        - Full
        - DynamicBinning

    currentType:
      description: |
        Operational current type of the resource either as AC or DC charger. This is not required and can be nulled in the payload.
      type: string
      optional: true
      enum:
        - DC
        - AC

    
    availableMarkets:
      description: |
        List of markets that the asset can operate in. Currently not required and can be nulled in the payload.
      type: string
      optional: true
      enum:
        - mFRR
        - aFRR
        - FCR_D_UP
        - FCR_D_DOWN
    subscriptionStatus:
      description: |
        Subscribes or unsubscribes a resource from control
      type: string
      enum:
        - Subscribed
        - Unsubscribed
    priceZone:
      type: string
      enum:
        - DK1
        - DK2
    eventKinds:
      type: string
      enum:
        - Status
        - Error
    statusEvents:
      type: string
      description: >
        Defines the status of the resource that allows the system to identify
        the availability or

        unavailability of the resource for control.
      enum:
        - Unavailable
        - Available
        - Offline

    acceptanceStr:
      type: string
      description: >
        Messages that define whether a particular activation signal is accepted
        by the backend

        and the EVSE resource that is being requested.
      enum:
        - Accepted
        - RejectedByEvse
        - EvseOffline
        - InternalError
        - InvalidEvseId
        - InvalidMessageFormat
        - EvDisconnected
        - NoEvCharging
        - Unauthorised
    ocppStatus:
      type: string
      description: |
        Defines the status of the resource tightly linked to the OCPP protocol
      enum:
        - Charging
        - SuspendedEV
        - Available
        - Unavailable
        - Preparing
        - Faulted
        - Reserved
        - SuspendedEVSE
        - Offline
    ActivationStr:
      type: string
      enum:
        - SetPowerLimit
        - ClearPowerLimit
    capabilityList:
      description: >
        The capability list needs to be an array of minimum length = 1. If this
        is not

        provided, the capability list will default to `[ "Basic" ]` in all usage
        cases. This requires 

        an explicit update to add additional features.
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/resourceCapability'
    binningConfigurationObject:
      description: >
        Configuration update for the `DynamicBinning` capability in the
        CapabilityList. This sets the 

        scale-start and scale-end in which the binning needs to be handled. The
        scale is a signed integer

        number scale with bin size in full integers. This configuration object
        is ignored if the resource

        does not contain the capability = "DynamicBinning".
      type: object
      properties:
        scale_start:
          type: integer
        scale_end:
          type: integer
        bin_size:
          type: integer
    marketRelationships:
      type: object
      description: >
        Object that describes the market relationships for a resource with
        different market parties in the network. This allows for allocating the
        resource in portfolios for allowing for control within the system for
        operating the asset correctly in different markets.
      properties:
        balance_responsible_party:
          type: object
          optional: true
          description: >
            The Balance Responsible Party (BRP) is obtained from the following
            [link](https://opendata.esett.com/brp). The code is the column
            called BRP Code and the encoding is the scheme used by the code
            internally.
          properties:
            code:
              description: >
                The code is the specification code for the BRP that is linked to
                the official ECP layer instead of being linked to the name
                provided by the code.
              type: string
            encoding:
              optional: true
              description: >
                The encoding scheme provides information on what standard the
                above code is encoded. It provided information on which country
                provides the identifier for the above BRP code.
              type: string
        retailer:
          description: >
            The Retailer is obtained from the following
            [link](https://opendata.esett.com/retailers) where the code is the
            column called RE Code and the coding scheme is also provided by the
            same link.
          type: object
          optional: true
          properties:
            code:
              description: >
                The code is the specification code for the retailer that is
                linked to the official ECP layer instead of being linked to the
                name provided by the code.
              type: string
            encoding:
              description: >
                The encoding scheme provides information on what standard the
                above code is encoded. It provided information on which country
                provides the identifier for the above Retailer code.
              type: string
        operator:
          optional: true
          description: >
            If using the operator, this allows for splitting it into a new
            portfolio automatically from the system level. Allowing for tracking
            resource level operations on the portfolio. This is a lower case
            string for the operator for operations.
          type: string
    ChargePointConfigurationUpdateObject:
      type: object
      description: >
        Partial modifications to a registered resource in the system. Only the
        parts

        of the resource system available for update are allowed updates in this
        use case.
      required:
        - event_id
        - resource_id
      properties:
        event_id:
          $ref: '#/components/schemas/eventId'
        resource_id:
          $ref: '#/components/schemas/resourceId'
        data:
          type: object
          optional: false
          properties:
            capability:
              optional: true
              $ref: '#/components/schemas/capabilityList'
            capability_configuration:
              optional: true
              $ref: '#/components/schemas/binningConfigurationObject'
            schedule:
              optional: true
              $ref: '#/components/schemas/resourceSchedule'
            subscription_status:
              optional: true
              $ref: '#/components/schemas/subscriptionStatus'
            market_relationships:
              optional: true
              $ref: '#/components/schemas/marketRelationships'
    ChargePointConfigurationObject:
      type: object
      required:
        - timestamp
        - event_id
        - resource_id
        - capability
        - subscription_status
      properties:
        timestamp:
          $ref: '#/components/schemas/timestamp'
        event_id:
          $ref: '#/components/schemas/eventId'
        resource_id:
          $ref: '#/components/schemas/resourceId'
        capability:
          $ref: '#/components/schemas/capabilityList'
        current_type:
          anyOf:
            - $ref: '#/components/schemas/currentType'
        markets:
          $ref: '#/components/schemas/availableMarkets'
        capability_configuration:
          oneOf:
            - $ref: '#/components/schemas/binningConfigurationObject'
        schedule:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/resourceSchedule'
        subscription_status:
          $ref: '#/components/schemas/subscriptionStatus'
        market_relationships:
          optional: true
          $ref: '#/components/schemas/marketRelationships'
    ResourceAcknowledgementMessagev1:
      type: object
      properties:
        event_id:
          $ref: '#/components/schemas/eventId'
        resource_id:
          $ref: '#/components/schemas/resourceId'
        timestamp:
          $ref: '#/components/schemas/timestamp'
        acceptance:
          $ref: '#/components/schemas/acceptanceStr'
        sent_at:
          $ref: '#/components/schemas/timestamp'
        executed_at:
          $ref: '#/components/schemas/timestamp'
    BulkResourceAcknowledgementMessagev1:
      type: array
      items:
        $ref: '#/components/schemas/ResourceAcknowledgementMessagev1'
    ResourceActivationMessage.v1:
      type: object
      description: >
        The resource activation is handled with a dynamic object. When the
        `activation=SetPowerLimit`,

        the client can expect the `power_limit_kw` and the `ends_at` to be valid
        values

        and they default to `null` when the `activation=ClearPowerLimit`. This
        should have

        the action of resetting the EVSE to the original setpoint before Hybrid
        Greentech took control of the resource.
      properties:
        event_id:
          $ref: '#/components/schemas/eventId'
        activation:
          $ref: '#/components/schemas/ActivationStr'
        timestamp:
          $ref: '#/components/schemas/timestamp'
        if:
          properties:
            activation:
              const: SetPowerLimit
        then:
          properties:
            power_limit_kw:
              type: number
            ends_at:
              $ref: '#/components/schemas/timestamp'
        else:
          properties:
            activation:
              const: ClearPowerLimit
            power_limit_kw:
              type: 'null'
            ends_at:
              type: 'null'
    ResourceActivationMessage.v2:
      type: object
      description: >
        The resource activation is handled with a dynamic object. The version to of
        of the activation payload has `activation = SetPowerLimit`. The client can
        expect the `power_limit_kw` and the `ends_at` fields to be valid values and 
        they default to `null` when the `activation=ClearPowerLimit`. This should have the 
        action of resetting the EVSE to the original setpoint before Hybrid Greentech took
        control of the resource.
      properties:
        event_id:
          $ref: '#/components/schemas/eventId'
        resource_id:
          $ref: '#/components/schemas/resourceId'
        activation:
          $ref: '#/components/schemas/ActivationStr'
        timestamp:
          $ref: '#/components/schemas/timestamp'
        if:
          properties:
            activation:
              const: SetPowerLimit
        then:
          properties:
            power_limit_kw:
              type: number
            ends_at:
              $ref: '#/components/schemas/timestamp'
        else:
          properties:
            activation:
              const: ClearPowerLimit
            power_limit_kw:
              type: 'null'
            ends_at:
              type: 'null'
    BulkActivationMessage.v2:
      type: array
      items:
        $ref: '#/components/schemas/ResourceActivationMessage.v2'
    ResourceEventMessagev1:
      type: object
      properties:
        event_id:
          $ref: '#/components/schemas/eventId'
        resource_id:
          $ref: '#/components/schemas/resourceId'
        status:
          $ref: '#/components/schemas/ocppStatus'
        time_since_heartbeat:
          $ref: '#/components/schemas/nullableTimestamp'
        timestamp_evse:
          $ref: '#/components/schemas/nullableTimestamp'
        timestamp_server:
          $ref: '#/components/schemas/timestamp'
    ResourceMeasurementMessagev1:
      type: object
      properties:
        event_id:
          $ref: '#/components/schemas/eventId'
        resource_id:
          $ref: '#/components/schemas/resourceId'
        power_kw:
          type: number
        timestamp_evse:
          $ref: '#/components/schemas/nullableTimestamp'
        timestamp_server:
          $ref: '#/components/schemas/timestamp'
    RegisterMessage:
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/ChargePointConfigurationObject'
  messages:
    AcknowledgeInBulkMessage:
      title: Acknowledge multiple actions on multiple resources in the system
      description: >-
        Message for dynamically acknowledging an activation command within the
        namespace
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BulkResourceAcknowledgementMessagev1'
    AcknowledgementMessage:
      title: Acknowlegement of an action by a single resource in the system
      description: >-
        Message for dynamically acknowledging an activation command within the
        namespace
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ResourceAcknowledgementMessagev1'
    BulkActivationMessagev1:
      title: Bulk Activation of Multiple Resources with Single Payload
      description: >-
        Message for dynamically activating a set of resources within the
        namespace
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BulkActivationMessage.v2'
    
    ActivationMessagev1:
      title: v1 Activation of Single Resource
      description: Message for dynamically activating a resource within the namespace
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ResourceActivationMessage.v1'
    ActivationMessagev2:
      title: v2 - Activation of a single resource in the system 
      description: >
        This is version 2 of the activation message for activating a single resource within the application. This activates a single resource in the system and includes a `resource_id` within the payload that allows for including this information for ensuring multiple points of resource-id allocation.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ResourceActivationMessage.v2'
    RegisterResourceInBulkMessage:
      title: Register multiple resources in the control plane
      description: >-
        Message for dynamically registering a resource within the namespace of a
        `PriceZone` and a `CustomerName`. This message is idempotent, it doesn't
        do a `PATCH` or `PUT` equivalent if a new message is sent. It can only
        used once. For updates to a resource the `update` topic should be used
        for doing mutations on the properties of the resources
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RegisterMessage'
    RegisterResourceMessage:
      title: Register a single resource in the control plane
      description: >-
        Message for dynamically registering a resource within the namespace of
        `PriceZone` and `CustomerName`.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChargePointConfigurationObject'
    UpdateResourceMessage:
      title: Partial modifications to a resource in the system
      description: Message for dynamically updating a resource in a particular namespace
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChargePointConfigurationUpdateObject'
    PowerMeasurementMessage:
      title: Measurement Message for EV Chargers in the system
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ResourceMeasurementMessagev1'
    EventsMessage:
      title: Events in the system
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ResourceEventMessagev1'
  parameters:
    priceZone:
      description: |
        Grid area or Price Zone in which the resource is operational
    customerName: |
      Operator or customer namespace
    resourceId: |
      Variable dictating the resource for which the messages are handled
  securitySchemes:
    user-password:
      type: userPassword
      description: >
        The credentials are generated during asset registration and must

        be securely stored. Connection attempts with invalid credentials are
        logged and 

        may trigger alerts.
